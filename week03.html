<!DOCTYPE html>

<html lang="ja">
    <head>
    <meta charset="utf-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>サザエさん一家の３人の子供紹介</title>

    <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-white p-8 mx-auto">
        <main class="mx-auto mx-w-4xl py-4">
            <h1 class="font-bold text-3xl mb-20">サザエさん一家３人の子供メンバー紹介</h1>
            <div class="flex flex-col md:flex-row gap-6">
                <div class="bg-blue-200 text-center p-6 flex flex-col shadow rounded-lg">
                    <img src="./img/かつお.png" alt="かつお" class="w-32 h-50 object-cover rounded-full mx-auto mb-4">
                    <h2 class="font-bold text-xl mb-2">かつお</h2>
                    <p>かつおは、元気でやんちゃな長男です。</p>
                </div>
                <div class="bg-green-100 text-center p-6 flex flex-col shadow rounded-lg">
                    <img src="./img/わかめ.png" alt="ワカメちゃん" class="w-32 h-50 object-cover rounded-full mx-auto mb-4">
                    <h2 class="font-green-50 text-xl mb-2">ワカメちゃん</h2>
                    <p>ワカメちゃんは、長女でしっかり者です。</p>
                </div>
                
                <div class="bg-gray-50 text-center p-6 flex flex-col shadow rounded-lg">
                    <img src="./img/たらちゃん.png" alt="タラちゃん" class="w-32 h-50 object-cover rounded-full mx-auto mb-4">
                    <h2 class="font-bold text-xl mb-2">タラちゃん</h2>
                    <p>タラちゃんは、明るくてかわいい子供です。</p>

                </div>

            </div>

        </main>
