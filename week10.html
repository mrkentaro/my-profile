<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHubユーザー検索</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-xl mx-auto">
      <h1 class="text-2xl font-bold mb-6 text-center">
        GitHubユーザー検索
      </h1>

      <div class="bg-white rounded-lg shadow p-6 mb-6">
        <label for="username" class="block font-medium mb-2">
          GitHubユーザー名
        </label>

        <div class="flex gap-2">
          <input
            type="text"
            id="username"
            class="flex-1 border rounded px-3 py-2"
            placeholder="例：octocat"
          >

          <button
            id="searchButton"
            class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
          >
            検索
          </button>
        </div>

        <p id="message" class="mt-3 text-sm"></p>
      </div>

      <div id="userCard"></div>
    </div>

    <script>
      const usernameInput = document.getElementById("username");
      const searchButton = document.getElementById("searchButton");
      const message = document.getElementById("message");
      const userCard = document.getElementById("userCard");

      async function searchUser() {
        const username = usernameInput.value.trim();

        message.textContent = "";
        userCard.innerHTML = "";

        if (username === "") {
          message.textContent = "GitHubユーザー名を入力してください";
          message.className = "mt-3 text-sm text-red-500";
          return;
        }

        message.textContent = "読み込み中...";
        message.className = "mt-3 text-sm text-gray-600";

        try {
          const response = await fetch(
            `https://api.github.com/users/${username}`
          );

          if (!response.ok) {
            message.textContent = "ユーザーが見つかりませんでした";
            message.className = "mt-3 text-sm text-red-500";
            return;
          }

          const user = await response.json();

          console.log(user);

          message.textContent = "";

          const displayName = user.name === null ? "名前未設定" : user.name;
          const displayBio = user.bio === null ? "自己紹介はありません" : user.bio;

          userCard.innerHTML = `
            <div class="bg-white rounded-lg shadow p-6 text-center">
              <img
                src="${user.avatar_url}"
                alt="${displayName}のアバター"
                class="w-28 h-28 rounded-full mx-auto mb-4"
              >

              <h2 class="text-xl font-bold mb-2">
                ${displayName}
              </h2>

              <p class="text-gray-600 mb-4">
                ${displayBio}
              </p>

              <div class="flex justify-center gap-6 mb-5">
                <div>
                  <p class="font-bold text-lg">${user.followers}</p>
                  <p class="text-sm text-gray-500">フォロワー</p>
                </div>

                <div>
                  <p class="font-bold text-lg">${user.public_repos}</p>
                  <p class="text-sm text-gray-500">リポジトリ</p>
                </div>
              </div>

              <a
                href="${user.html_url}"
                target="_blank"
                class="inline-block bg-gray-800 text-white px-4 py-2 rounded hover:bg-gray-700"
              >
                GitHubを見る
              </a>
            </div>
          `;
        } catch (error) {
          message.textContent = "データの取得に失敗しました";
          message.className = "mt-3 text-sm text-red-500";

          console.error(error);
        }
      }

      searchButton.addEventListener("click", searchUser);
    </script>
  </body>
</html>
