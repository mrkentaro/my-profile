<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー登録フォーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">

    <div class="bg-white w-full max-w-md p-6 rounded-xl shadow-md">
      <h1 class="text-2xl font-bold text-center mb-6">
        ユーザー登録
      </h1>

      <form id="registerForm" novalidate class="space-y-5">

        <div>
          <label for="name" class="block mb-1 font-medium">
            名前
          </label>

          <input
            type="text"
            id="name"
            required
            class="w-full border rounded px-3 py-2"
            placeholder="山田太郎"
          >

          <p id="nameError" class="text-red-500 text-sm mt-1"></p>
        </div>

        <div>
          <label for="email" class="block mb-1 font-medium">
            メールアドレス
          </label>

          <input
            type="email"
            id="email"
            required
            class="w-full border rounded px-3 py-2"
            placeholder="example@mail.com"
          >

          <p id="emailError" class="text-red-500 text-sm mt-1"></p>
        </div>

        <div>
          <label for="password" class="block mb-1 font-medium">
            パスワード
          </label>

          <input
            type="password"
            id="password"
            required
            class="w-full border rounded px-3 py-2"
            placeholder="8文字以上で入力"
          >

          <p id="passwordError" class="text-red-500 text-sm mt-1"></p>
        </div>

        <div>
          <div class="flex items-center gap-2">
            <input
              type="checkbox"
              id="agree"
              required
            >

            <label for="agree">
              利用規約に同意する
            </label>
          </div>

          <p id="agreeError" class="text-red-500 text-sm mt-1"></p>
        </div>

        <button
          type="submit"
          class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
        >
          登録する
        </button>

        <p
          id="successMessage"
          class="text-green-600 font-bold text-center"
        ></p>

      </form>
    </div>


    <script>
      const form = document.getElementById("registerForm");

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const agree = document.getElementById("agree").checked;

        const nameError = document.getElementById("nameError");
        const emailError = document.getElementById("emailError");
        const passwordError = document.getElementById("passwordError");
        const agreeError = document.getElementById("agreeError");
        const successMessage = document.getElementById("successMessage");

        nameError.textContent = "";
        emailError.textContent = "";
        passwordError.textContent = "";
        agreeError.textContent = "";
        successMessage.textContent = "";

        let hasError = false;

        if (name === "") {
          nameError.textContent = "名前を入力してください";
          hasError = true;
        }

        if (email === "") {
          emailError.textContent = "メールアドレスを入力してください";
          hasError = true;
        } else if (!email.includes("@")) {
          emailError.textContent = "正しいメールアドレスを入力してください";
          hasError = true;
        }

        if (password === "") {
          passwordError.textContent = "パスワードを入力してください";
          hasError = true;
        } else if (password.length < 8) {
          passwordError.textContent = "パスワードは8文字以上で入力してください";
          hasError = true;
        }

        if (!agree) {
          agreeError.textContent = "利用規約に同意してください";
          hasError = true;
        }

        if (!hasError) {
          successMessage.textContent = "登録完了！";
        }
      });
    </script>

  </body>
</html>
