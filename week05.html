<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>week5課題</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-10">
    <header class="shadow bg-green-50 px-6 py-4 mb-10">
        <div class="max-w-4xl mx-auto flex felx-col md:felx-row md:items-center md:justify-between">
            <h1 class="text-2xl font-bold ">森田学校</h1>
            <nav class="flex flex-col md:flex-row gap-2 md:gap-6 ">
                <a href="#" class="hover:text-green-400 text-xl">home</a>
                <a href="#" class="hover:text-green-400 text-xl">activity</a>
                <a href="#" class="hover:text-green-400 text-xl">contact</a>
            </nav>
        </div>
    </header>
    <main class="max-w-4xl mx-auto px-2 py-8 mb-10">
        <section class="text-center mb-7">
            <h2 class="font-bold text-2xl mb-6">自然を体系的に学ぶ</h2>
            <p class="fonto-bold text-xl">学校は山や川などの多くの自然に囲まれリラックスしながら学習することができます。</p>
        </section>
        <section class="mb-10">
            <h2 class="font-bold mb-5 text-2xl"></h2>
            <div class="grid grid-col md:grid-cols-3 gap-4">
                <div class="bg-green-50 shadow rounded-lg hover:shadow-lg transition py-4 mb-5">
                    <h3 class="text-sm mb-3">外出課外</h3>
                    <p>窓の外すぐそこには森と川があり、身近に自然を感じます。🏔🌊</p>
                </div>
                <div class="bg-green-50 shadow rounded-lg hover:shadow-lg transition py-4 mb-5">
                    <h3 class="text-sm mb-3">ボランティア活動</h3>
                    <p>年間総数1000回をめざして活動します。</p>
                </div>
                <div class="bg-green-50 shadow rounded-lg hover:shadow-lg transition py-4 mb-5">
                    <h3 class="text-sm mb-3">田舎クッキング</h3>
                    <p>田舎ならではの食材を用いて世界で一つだけの料理を作ります。</p>
                </div>
                <div class="bg-green-50 shadow rounded-lg hover:shadow-lg transition py-4">
                    <h3 class="text-sm mb-3">国際教育</h3>
                    <p>姉妹校であるアメリカのTamori高校とオンラインで語学交流をします。</p>
                </div>
                <div class="bg-green-50 shadow rounded-lg hover:shadow-lg transition py-4">
                    <h3 class="text-sm mb-3">デジタル教育</h3>
                    <p>パソコン操作を主にします。</p>
                </div>
                <div class="bg-green-50 shadow rounded-lg hover:shadow-jg transition py-4">
                    <h3 class="text-sm mb-3">遠足</h3>
                    <p>山梨県の全市町村を在学中にめぐります。</p>
                </div>
            </div>
        </section>
    </main>
    <footer class="bg-green-100  max-w-4xl mx-auto text-center">2026.森田学校</footer>

</body>
